// star_k
// Listenserver.cfg is setting of your server
// This is mainly for speedrun / exploring and includes sourcemod binds
//
// Last update: 3 Sep 2026
//

// Binds 
bind 6 "toggle r_drawclipbrushes 2 0"
bind 7 "toggle vcollide_wireframe 1 0" // Require Multicore Rendering DISABLED
bind 8 "toggle mat_wireframe 1 0" 
bind 9 "showtriggers_toggle"
bind 0 "toggle mat_fullbright 1 0"
bind ENTER "director_stop; nb_delete_all; script_execute z_developer_showupdate; script_execute speedgainlost"
bind [ "script ShowUpdate(); r_drawclipbrushes 1"
bind ] "script HideUpdate(); r_drawclipbrushes 0"
bind n "noclip"
bind b "ent_create point_commentary_node" // Ping thing 
bind h "say !rst"
bind MOUSE3 "give health; respawn_all; respawn"
// bind g "go_away_from_keyboard"

// Server settings 
sv_cheats 1
sv_lan 1 
sv_noclipspeed 3
vs_max_team_switches 999
director_no_death_check 1
sb_all_bot_game 1
cl_showpos 1
god 1

// sm_speedrunner_tools.smx	
st_idle_anytime 1
st_edgebug 1
bind g "st_idle 1" // For the host

// Defib plugin
alias df1 "nb_delete_all; wait 5; sm_fake; wait 50; warp_all_survivors_to_checkpoint; wait 50; say !saferoom"
alias df2 "say !defib"

// Xclip 
alias exc "say !xclip exact"
alias dxc "say !xclip double"

bind c exc
bind v dxc

