// Some binds
bind f4 "jpeg"
bind f5 "jointeam 1; spectate"	
bind f6 "jointeam 2"			
bind f7 "jointeam 3"			
bind "F10" "disconnect"
bind g "go_away_from_keyboard"
bind ENTER "r_cleardecals; cl_destroy_ragdolls; record replay; stop"
unbind c
unbind v

// null-cancel + dsp
bind "W" "+mfwd"
bind "A" "+mleft"
bind "S" "+mback"
bind "D" "+mright"
alias +mfwd "dsp_volume 0;-back;+forward;alias checkfwd +forward"
alias +mback "dsp_volume 0;-forward;+back;alias checkback +back"
alias +mleft "dsp_volume 0;-moveright;+moveleft;alias checkleft +moveleft"
alias +mright "dsp_volume 0;-moveleft;+moveright;alias checkright +moveright"
alias -mfwd "-forward;checkback;alias checkfwd none"
alias -mback "-back;checkfwd;alias checkback none"
alias -mleft "-moveleft;checkright;alias checkleft none"
alias -mright "-moveright;checkleft;alias checkright none"
alias checkfwd "none"
alias checkback "none"
alias checkleft "none"
alias checkright "none"
alias none ""

// Hunter ceiling
bind "LEFTARROW" "+left"
bind "RIGHTARROW" "+right"

// Dynamic crosshair sniper
bind alt "+zoom; cl_crosshair_dynamic 1" 
bind mouse2 "+attack2; cl_crosshair_dynamic 0"

// Jump crouch at the same time (WILL BREAK YOUR SPACEBAR WHEN SPEC) 
// For machine gun trick because my keyboard is stiff
alias +jd "+jump; +duck"
alias -jd "-jump; -duck"

// Lerp for confogl / normal 30-tick
alias confogl "cl_interp 0; rate 100000; cl_cmdrate 100; cl_updaterate 100; cl_interp_ratio 0"
alias normal "cl_interp 0.0333; rate 30000; cl_cmdrate 30; cl_updaterate 30; cl_interp_ratio 0"

normal

clear

echo Config loaded!